<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:       #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft:  #eef2ff;
      --bg:           #f5f4f2;
      --panel:        #ffffff;
      --border:       #e8e4de;
      --text:         #1a1917;
      --muted:        #78716c;
      --faint:        #a8a29e;
      --radius:       10px;
      --sidebar-w:    224px;
      --list-w:       310px;
      --sh-sm:        0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --sh:           0 4px 18px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────────── */
    .header {
      height: 50px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: var(--sh-sm);
      z-index: 10;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.4px;
      margin-right: auto;
    }
    .logo em { font-style: normal; color: var(--accent); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: #f0ede8; border-color: #d4cfc8; }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-danger { color: #dc2626; border-color: #fecaca; background: #fff; }
    .btn-danger:hover { background: #fef2f2; }

    /* ── App body ────────────────────────────────────── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Welcome screen ──────────────────────────────── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 32px;
    }
    .welcome-icon { font-size: 52px; line-height: 1; }
    .welcome h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .welcome p { font-size: 14px; color: var(--muted); max-width: 300px; line-height: 1.55; }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 28px 52px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-top: 6px;
    }
    .drop-zone:hover, .drop-zone.over {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .drop-zone-label { font-weight: 600; color: var(--accent); margin-bottom: 3px; }
    .drop-zone-sub { font-size: 12px; color: var(--faint); }

    .welcome-or { font-size: 12px; color: var(--faint); }

    /* ── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-section { padding: 14px 10px 8px; }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--faint);
      padding: 0 6px;
      margin-bottom: 5px;
    }

    .cat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
      gap: 8px;
    }
    .cat-item:hover { background: #f0ede8; }
    .cat-item.active { background: var(--accent-soft); color: var(--accent); }

    .cat-label {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }
    .cat-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .cat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cat-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--faint);
      background: #f0ede8;
      padding: 1px 6px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .cat-item.active .cat-count { background: #dde0ff; color: var(--accent); }

    .divider { height: 1px; background: var(--border); margin: 8px 8px; }

    /* ── List column ─────────────────────────────────── */
    .list-col {
      width: var(--list-w);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      background: #f9f8f6;
    }

    .search-bar {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    .search-inner { position: relative; }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--faint);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 7px 10px 7px 30px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 13px;
      font-family: inherit;
      background: #f5f4f2;
      color: var(--text);
      outline: none;
      transition: border-color 0.12s, background 0.12s;
    }
    .search-input:focus { border-color: var(--accent); background: #fff; }

    .list-meta {
      font-size: 11px;
      color: var(--faint);
      padding: 6px 12px 4px;
    }

    .list-items { flex: 1; overflow-y: auto; padding: 6px 8px 8px; }

    .bm-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 5px;
      cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .bm-card:hover { border-color: #c4c0f7; box-shadow: 0 2px 10px rgba(99,102,241,0.1); }
    .bm-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99,102,241,0.15); }

    .bm-top {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 3px;
    }
    .bm-title {
      font-weight: 600;
      font-size: 13px;
      line-height: 1.4;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .pin-dot {
      color: var(--accent);
      font-size: 11px;
      flex-shrink: 0;
      opacity: 0;
      margin-top: 2px;
    }
    .bm-card.pinned .pin-dot { opacity: 1; }

    .bm-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .bm-footer { display: flex; align-items: center; gap: 6px; }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.1px;
    }

    .no-items {
      text-align: center;
      padding: 40px 16px;
      color: var(--faint);
      font-size: 13px;
    }

    /* ── Detail column ───────────────────────────────── */
    .detail-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--panel);
    }

    .detail-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--faint);
    }
    .detail-empty-icon { font-size: 36px; opacity: 0.45; }
    .detail-empty-title { font-weight: 600; font-size: 15px; color: var(--muted); }
    .detail-empty-sub { font-size: 13px; }

    .detail-wrap {
      flex: 1;
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-footer {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .field-group { display: flex; flex-direction: column; gap: 5px; }

    .field-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--faint);
    }

    .field-input {
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #faf9f8;
      outline: none;
      width: 100%;
      transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
    }
    .field-input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }

    .url-row { display: flex; gap: 8px; }
    .url-row .field-input { flex: 1; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #faf9f8;
      color: var(--muted);
      transition: all 0.12s;
      text-decoration: none;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mode-tabs { display: flex; gap: 3px; }
    .mode-tab {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #faf9f8;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      transition: all 0.12s;
    }
    .mode-tab:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .mode-tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

    .notes-preview {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      min-height: 120px;
      max-height: 320px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.65;
      background: #faf9f8;
    }
    .notes-preview * { max-width: 100%; }
    .notes-preview a { color: var(--accent); }
    .notes-preview ul, .notes-preview ol { padding-left: 20px; }
    .notes-preview p { margin-bottom: 6px; }
    .notes-preview p:last-child { margin-bottom: 0; }

    .notes-textarea {
      width: 100%;
      min-height: 120px;
      max-height: 320px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      background: #faf9f8;
      outline: none;
      resize: vertical;
      line-height: 1.55;
      transition: border-color 0.12s, box-shadow 0.12s, background 0.12s;
    }
    .notes-textarea:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
    }

    .pin-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 2px 0;
    }
    .pin-checkbox {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .pin-row label {
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    /* ── Scrollbars ──────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d6d0c8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #bfb8ae; }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 960px) { .sidebar { display: none !important; } }
    @media (max-width: 640px) {
      .list-col { width: 100%; border-right: none; }
      .detail-col { display: none !important; }
    }

    #file-input { display: none; }

    svg { display: block; }
  </style>
</head>
<body>

<input type="file" id="file-input" accept=".csv">
<datalist id="cat-datalist"></datalist>

<!-- ── Header ── -->
<header class="header">
  <div class="logo">Book<em>marks</em></div>
  <button class="btn" onclick="triggerFileInput()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    Load CSV
  </button>
  <button class="btn" onclick="exportCSV()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Export
  </button>
  <button class="btn btn-accent" onclick="newBookmark()">+ New</button>
</header>

<!-- ── App body ── -->
<div class="app-body" id="app-body">

  <!-- Welcome / empty state -->
  <div class="welcome" id="welcome-screen">
    <div class="welcome-icon">🔖</div>
    <h2>Bookmark Manager</h2>
    <p>Load a CSV with columns <strong>Title, URL, Category, Notes</strong> — or start fresh.</p>
    <div class="drop-zone" id="drop-zone" onclick="triggerFileInput()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 10px;">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <div class="drop-zone-label">Click to load CSV</div>
      <div class="drop-zone-sub">or drag & drop a .csv file</div>
    </div>
    <div class="welcome-or">— or —</div>
    <button class="btn btn-accent" onclick="newBookmark()">Start fresh without CSV</button>
  </div>

  <!-- Sidebar (categories) -->
  <aside class="sidebar" id="sidebar" style="display:none">
    <div class="sidebar-section">
      <div class="section-label">Views</div>
      <div id="cat-list"></div>
    </div>
  </aside>

  <!-- Middle list -->
  <div class="list-col" id="list-col" style="display:none">
    <div class="search-bar">
      <div class="search-inner">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" type="text" id="search-input" placeholder="Search…" oninput="renderList()">
      </div>
    </div>
    <div class="list-meta" id="list-meta"></div>
    <div class="list-items" id="list-items"></div>
  </div>

  <!-- Detail / editor -->
  <section class="detail-col" id="detail-col" style="display:none">
    <div class="detail-empty" id="detail-empty">
      <div class="detail-empty-icon">👆</div>
      <div class="detail-empty-title">Select a bookmark</div>
      <div class="detail-empty-sub">Click any card to view or edit</div>
    </div>
    <div class="detail-wrap" id="detail-wrap">
      <div class="detail-scroll" id="detail-scroll">
        <!-- injected by renderDetail() -->
      </div>
      <div class="detail-footer">
        <button class="btn btn-accent" onclick="saveBookmark()">Save</button>
        <button class="btn btn-danger" onclick="deleteBookmark()" style="margin-left:auto">Delete</button>
      </div>
    </div>
  </section>

</div><!-- /app-body -->

<script>
/* ════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════ */
let bookmarks    = [];
let activeId     = null;
let selectedCat  = 'all';
let notesMode    = 'preview';   // 'preview' | 'edit'
let appReady     = false;

const LS_KEY = 'bm_simple_data';

/* ════════════════════════════════════════════════════
   LOCALSTORAGE
   ════════════════════════════════════════════════════ */
function lsLoad() {
  try { const r = localStorage.getItem(LS_KEY); if (r) return JSON.parse(r); } catch(_) {}
  return null;
}
function lsSave() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(bookmarks)); } catch(_) {}
}

/* ════════════════════════════════════════════════════
   RFC 4180 CSV PARSER
   ════════════════════════════════════════════════════ */
function parseCSV(raw) {
  raw = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const rows = [];
  const n = raw.length;
  let i = 0;

  while (i < n) {
    const row = [];

    // parse one row
    while (true) {
      if (i >= n || raw[i] === '\n') break;

      let field = '';
      if (raw[i] === '"') {
        i++; // skip opening "
        while (i < n) {
          if (raw[i] === '"') {
            if (i + 1 < n && raw[i+1] === '"') { field += '"'; i += 2; }
            else { i++; break; }
          } else {
            field += raw[i++];
          }
        }
      } else {
        while (i < n && raw[i] !== ',' && raw[i] !== '\n') field += raw[i++];
      }

      row.push(field);
      if (i < n && raw[i] === ',') { i++; } else { break; }
    }

    if (i < n && raw[i] === '\n') i++;
    if (row.length && !(row.length === 1 && row[0].trim() === '')) rows.push(row);
  }

  return rows;
}

/* ════════════════════════════════════════════════════
   ID HELPERS
   ════════════════════════════════════════════════════ */
function stableId(title, url) {
  const s = ((title || '') + '|' + (url || '')).toLowerCase();
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return 'bm_' + (h >>> 0).toString(36);
}
function freshId() {
  return 'bm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
}

/* ════════════════════════════════════════════════════
   CSV → LOAD
   ════════════════════════════════════════════════════ */
function loadCSV(text) {
  const rows = parseCSV(text);
  if (!rows.length) return;

  const first = rows[0];
  const isHeader = /^(title|name|url|link)/i.test(first[0] || '');
  const dataRows = isHeader ? rows.slice(1) : rows;

  const lsData  = lsLoad();
  const lsMap   = lsData ? new Map(lsData.map(b => [b.id, b])) : new Map();

  const loaded = dataRows
    .filter(r => r.some(c => c.trim()))
    .map(r => {
      const [title='', url='', category='', notes=''] = r;
      const id = stableId(title.trim(), url.trim());
      return lsMap.get(id) || {
        id, pinned: false,
        title:    title.trim(),
        url:      url.trim(),
        category: category.trim() || 'Uncategorized',
        notes:    notes.trim()
      };
    });

  // Keep any LS-only bookmarks (manually created, not in CSV)
  const csvIds = new Set(loaded.map(b => b.id));
  const extras = lsData ? lsData.filter(b => !csvIds.has(b.id)) : [];

  bookmarks = [...extras, ...loaded];
  lsSave();
  showApp();
}

/* ════════════════════════════════════════════════════
   CSV → EXPORT
   ════════════════════════════════════════════════════ */
function csvEsc(v) {
  const s = String(v == null ? '' : v);
  return (s.includes(',') || s.includes('"') || s.includes('\n'))
    ? '"' + s.replace(/"/g, '""') + '"'
    : s;
}
function exportCSV() {
  if (!bookmarks.length) { alert('Nothing to export.'); return; }
  const lines = [['Title','URL','Category','Notes'].map(csvEsc).join(',')];
  bookmarks.forEach(b => lines.push([b.title, b.url, b.category, b.notes].map(csvEsc).join(',')));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: 'bookmarks-export.csv'
  });
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ════════════════════════════════════════════════════
   SHOW APP (after first data load)
   ════════════════════════════════════════════════════ */
function showApp() {
  appReady = true;
  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('sidebar').style.display = '';
  document.getElementById('list-col').style.display = '';
  document.getElementById('detail-col').style.display = '';
  renderSidebar();
  renderList();
}

/* ════════════════════════════════════════════════════
   CATEGORY COLOR PALETTE
   ════════════════════════════════════════════════════ */
const PALETTE = [
  {bg:'#fef3c7', fg:'#92400e'}, {bg:'#dbeafe', fg:'#1e40af'},
  {bg:'#dcfce7', fg:'#166534'}, {bg:'#fce7f3', fg:'#9d174d'},
  {bg:'#f3e8ff', fg:'#6b21a8'}, {bg:'#ffedd5', fg:'#9a3412'},
  {bg:'#cffafe', fg:'#155e75'}, {bg:'#e0e7ff', fg:'#3730a3'},
  {bg:'#fef9c3', fg:'#713f12'}, {bg:'#d1fae5', fg:'#065f46'},
];
function catColor(cat) {
  let h = 5381;
  const s = String(cat || '');
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
  return PALETTE[(h >>> 0) % PALETTE.length];
}

/* ════════════════════════════════════════════════════
   SIDEBAR
   ════════════════════════════════════════════════════ */
function renderSidebar() {
  const counts = {};
  let pinned = 0;
  for (const b of bookmarks) {
    counts[b.category] = (counts[b.category] || 0) + 1;
    if (b.pinned) pinned++;
  }
  const cats = Object.keys(counts).sort();

  const ico = (path) =>
    `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;

  let html = `
    <div class="cat-item ${selectedCat==='all'?'active':''}" onclick="pickCat('all')">
      <div class="cat-label">
        ${ico('<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>')}
        <span>All</span>
      </div>
      <span class="cat-count">${bookmarks.length}</span>
    </div>`;

  if (pinned) {
    html += `
      <div class="cat-item ${selectedCat==='__pinned__'?'active':''}" onclick="pickCat('__pinned__')">
        <div class="cat-label">
          ${ico('<line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17H19V15L17 10V4H7V10L5 15V17Z"/>')}
          <span>Pinned</span>
        </div>
        <span class="cat-count">${pinned}</span>
      </div>`;
  }

  html += '<div class="divider"></div><div class="section-label" style="padding:0 6px 5px">Categories</div>';

  cats.forEach(cat => {
    const c = catColor(cat);
    html += `
      <div class="cat-item ${selectedCat===cat?'active':''}" data-cat="${escA(cat)}" onclick="pickCat(this.dataset.cat)">
        <div class="cat-label">
          <span class="cat-dot" style="background:${c.fg}"></span>
          <span>${esc(cat)}</span>
        </div>
        <span class="cat-count">${counts[cat]}</span>
      </div>`;
  });

  document.getElementById('cat-list').innerHTML = html;

  // datalist for category autocomplete
  document.getElementById('cat-datalist').innerHTML =
    cats.map(c => `<option value="${escA(c)}">`).join('');
}

function pickCat(cat) {
  selectedCat = cat;
  renderSidebar();
  renderList();
}

/* ════════════════════════════════════════════════════
   LIST
   ════════════════════════════════════════════════════ */
function filteredBookmarks() {
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  let list = bookmarks;

  if (selectedCat === '__pinned__') list = list.filter(b => b.pinned);
  else if (selectedCat !== 'all') list = list.filter(b => b.category === selectedCat);

  if (q) list = list.filter(b =>
    b.title.toLowerCase().includes(q) ||
    b.url.toLowerCase().includes(q) ||
    b.category.toLowerCase().includes(q)
  );

  return list.slice().sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    return (a.title||'').toLowerCase().localeCompare((b.title||'').toLowerCase());
  });
}

function domain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (_) { return url.slice(0, 40); }
}

function renderList() {
  const items = filteredBookmarks();
  document.getElementById('list-meta').textContent =
    `${items.length} bookmark${items.length !== 1 ? 's' : ''}`;

  if (!items.length) {
    document.getElementById('list-items').innerHTML =
      '<div class="no-items">No bookmarks found</div>';
    return;
  }

  document.getElementById('list-items').innerHTML = items.map(b => {
    const c = catColor(b.category);
    return `
      <div class="bm-card ${b.id === activeId ? 'active' : ''} ${b.pinned ? 'pinned' : ''}"
           data-id="${escA(b.id)}" onclick="openBookmark(this.dataset.id)">
        <div class="bm-top">
          <div class="bm-title">${esc(b.title || 'Untitled')}</div>
          <span class="pin-dot" title="Pinned">📌</span>
        </div>
        <div class="bm-url">${esc(domain(b.url))}</div>
        <div class="bm-footer">
          <span class="badge" style="background:${c.bg};color:${c.fg}">${esc(b.category)}</span>
        </div>
      </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════
   DETAIL / EDITOR
   ════════════════════════════════════════════════════ */
function openBookmark(id) {
  activeId  = id;
  notesMode = 'preview';
  renderList();
  renderDetail();
}

function renderDetail() {
  const bm        = bookmarks.find(b => b.id === activeId);
  const emptyEl   = document.getElementById('detail-empty');
  const wrapEl    = document.getElementById('detail-wrap');

  if (!bm) {
    emptyEl.style.display = '';
    wrapEl.style.display  = 'none';
    return;
  }

  emptyEl.style.display = 'none';
  wrapEl.style.display  = 'flex';

  const notesContent = notesMode === 'preview'
    ? `<div class="notes-preview">${sanitize(bm.notes || '<span style="color:#a8a29e">No notes.</span>')}</div>`
    : `<textarea class="notes-textarea" id="notes-ta">${esc(bm.notes || '')}</textarea>`;

  document.getElementById('detail-scroll').innerHTML = `
    <div class="field-group">
      <div class="field-label">Title</div>
      <input class="field-input" id="f-title" type="text" value="${escA(bm.title)}" placeholder="Untitled">
    </div>
    <div class="field-group">
      <div class="field-label">URL</div>
      <div class="url-row">
        <input class="field-input" id="f-url" type="text" value="${escA(bm.url)}" placeholder="https://">
        <a class="icon-btn" id="url-link" href="${escA(bm.url)}" target="_blank" rel="noopener noreferrer" title="Open in new tab">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Category</div>
      <input class="field-input" id="f-cat" type="text" list="cat-datalist" value="${escA(bm.category)}" placeholder="Category">
    </div>
    <div class="field-group">
      <div class="notes-header">
        <div class="field-label">Notes</div>
        <div class="mode-tabs">
          <button class="mode-tab ${notesMode==='preview'?'on':''}" onclick="switchNotes('preview')">Preview</button>
          <button class="mode-tab ${notesMode==='edit'?'on':''}"    onclick="switchNotes('edit')">Edit HTML</button>
        </div>
      </div>
      ${notesContent}
    </div>
    <div class="pin-row">
      <input class="pin-checkbox" type="checkbox" id="f-pin" ${bm.pinned?'checked':''}>
      <label for="f-pin">Pin to top</label>
    </div>
  `;

  // Keep URL link in sync as user types
  document.getElementById('f-url').addEventListener('input', function() {
    document.getElementById('url-link').href = this.value;
  });
}

function switchNotes(mode) {
  // Flush textarea before switching away from edit mode
  if (notesMode === 'edit') {
    const ta = document.getElementById('notes-ta');
    const bm = bookmarks.find(b => b.id === activeId);
    if (ta && bm) bm.notes = ta.value;
  }
  notesMode = mode;
  renderDetail();
}

/* ════════════════════════════════════════════════════
   CRUD
   ════════════════════════════════════════════════════ */
function saveBookmark() {
  const bm = bookmarks.find(b => b.id === activeId);
  if (!bm) return;

  // Collect notes
  let notes = bm.notes;
  if (notesMode === 'edit') {
    const ta = document.getElementById('notes-ta');
    if (ta) notes = ta.value;
  }

  Object.assign(bm, {
    title:    (document.getElementById('f-title').value || '').trim(),
    url:      (document.getElementById('f-url').value   || '').trim(),
    category: (document.getElementById('f-cat').value   || '').trim() || 'Uncategorized',
    pinned:    document.getElementById('f-pin').checked,
    notes
  });

  lsSave();
  renderSidebar();
  renderList();
  renderDetail();
}

function deleteBookmark() {
  const bm = bookmarks.find(b => b.id === activeId);
  if (!bm) return;
  if (!confirm(`Delete "${bm.title || 'this bookmark'}"?`)) return;
  bookmarks = bookmarks.filter(b => b.id !== activeId);
  activeId  = null;
  lsSave();
  renderSidebar();
  renderList();
  renderDetail();
}

function newBookmark() {
  if (!appReady) {
    appReady = true;
    document.getElementById('welcome-screen').style.display = 'none';
    document.getElementById('sidebar').style.display = '';
    document.getElementById('list-col').style.display = '';
    document.getElementById('detail-col').style.display = '';
  }

  const defaultCat = (selectedCat !== 'all' && selectedCat !== '__pinned__')
    ? selectedCat : 'General';

  const bm = { id: freshId(), title: '', url: '', category: defaultCat, notes: '', pinned: false };
  bookmarks.unshift(bm);
  activeId  = bm.id;
  notesMode = 'edit';

  lsSave();
  renderSidebar();
  renderList();
  renderDetail();

  setTimeout(() => document.getElementById('f-title')?.focus(), 30);
}

/* ════════════════════════════════════════════════════
   HTML SANITIZER (strip scripts/events for preview)
   ════════════════════════════════════════════════════ */
function sanitize(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('script,iframe,object,embed,form,style').forEach(el => el.remove());
  div.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      if (/^on/i.test(a.name) || (a.name === 'href' && /^javascript:/i.test(a.value))) {
        el.removeAttribute(a.name);
      }
    });
  });
  return div.innerHTML;
}

/* ════════════════════════════════════════════════════
   ESCAPE HELPERS
   ════════════════════════════════════════════════════ */
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escA(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ════════════════════════════════════════════════════
   FILE INPUT & DRAG-DROP
   ════════════════════════════════════════════════════ */
function triggerFileInput() { document.getElementById('file-input').click(); }

function readFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => loadCSV(e.target.result);
  reader.readAsText(file, 'UTF-8');
}

document.getElementById('file-input').addEventListener('change', function() {
  readFile(this.files[0]);
  this.value = '';
});

const dropZone = document.getElementById('drop-zone');
['dragover','dragenter'].forEach(ev => {
  dropZone?.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('over'); });
});
['dragleave','dragend'].forEach(ev => {
  dropZone?.addEventListener(ev, () => dropZone.classList.remove('over'));
});
dropZone?.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('over');
  readFile(e.dataTransfer.files[0]);
});

// Whole-page drag-drop (after app is ready)
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f?.name.endsWith('.csv')) readFile(f);
});

/* ════════════════════════════════════════════════════
   BOOT — restore from localStorage if available
   ════════════════════════════════════════════════════ */
(function boot() {
  const saved = lsLoad();
  if (saved && saved.length > 0) {
    bookmarks = saved;
    showApp();
  }
})();
</script>
